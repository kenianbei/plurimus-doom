[package]
name = "plurimus-doom"
description = "Doom in the terminal: doomgeneric rendered as halfblock cells through plurimus."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
publish = false

[features]
gpu = [
    "plurimus/3d",
    "dep:bevy_asset",
    "dep:bevy_camera",
    "dep:bevy_core_pipeline",
    "dep:bevy_image",
    "dep:bevy_math",
    "dep:bevy_mesh",
    "dep:bevy_pbr",
    "dep:bevy_reflect",
    "dep:bevy_render",
    "dep:bevy_shader",
    "dep:bevy_transform",
]

[dependencies]
doomgeneric = "=0.3.0"
plurimus = "0.7"
ratatui-widgets = "0.3.2"
bevy_app = "0.19"
bevy_ecs = "0.19"
libc = "0.2"
bevy_asset = { version = "0.19", optional = true }
bevy_camera = { version = "0.19", optional = true }
bevy_core_pipeline = { version = "0.19", optional = true }
bevy_image = { version = "0.19", optional = true }
bevy_math = { version = "0.19", optional = true }
bevy_mesh = { version = "0.19", optional = true }
bevy_pbr = { version = "0.19", optional = true }
bevy_reflect = { version = "0.19", optional = true }
bevy_render = { version = "0.19", optional = true }
bevy_shader = { version = "0.19", optional = true }
bevy_transform = { version = "0.19", optional = true }

[dev-dependencies]
bevy_tasks = "0.19"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
type_complexity = "allow"
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
